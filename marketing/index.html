<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F5F3ED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101713" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var t = localStorage.getItem('acadence.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>Acadence — Your academic life, in one calm place</title>
    <meta name="description" content="Acadence is a student hub that brings your Canvas courses, assignments, grades and announcements into one customizable dashboard for web and mobile. Currently in development." />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Acadence" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Acadence — Your academic life, in one calm place" />
    <meta property="og:description" content="Canvas courses, assignments, grades and announcements in one customizable student hub. In active development." />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Acadence Home dashboard showing pinned assignments, upcoming deadlines and course cards." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Acadence — Your academic life, in one calm place" />
    <meta name="twitter:description" content="Canvas courses, assignments, grades and announcements in one customizable student hub." />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Acadence",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web, iOS, Android",
        "description": "A student hub that brings Canvas courses, assignments, grades and announcements into one customizable dashboard.",
        "url": "%SITE_URL%/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width:640px;margin:64px auto;padding:0 16px;font-family:system-ui,sans-serif;line-height:1.6">
        <h1>Acadence</h1>
        <p>Acadence is a student hub that brings your Canvas courses, assignments, grades and announcements into one customizable dashboard for web and mobile. It is currently in active development.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
